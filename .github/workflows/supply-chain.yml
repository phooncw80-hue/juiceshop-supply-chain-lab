name: Supply Chain Scan
2
 
3
on:
4
push:
5
branches:
6
- main
7
pull_request:
8
 
9
jobs:
10
guarddog-scan:
11
runs-on: ubuntu-latest
12
 
13
steps:
14
- name: Checkout repository
15
uses: actions/checkout@v4
16
 
17
- name: Set up Python
18
uses: actions/setup-python@v5
19
with:
20
python-version: "3.x"
21
 
22
- name: Install GuardDog & jq
23
run: |
24
pip3 install guarddog
25

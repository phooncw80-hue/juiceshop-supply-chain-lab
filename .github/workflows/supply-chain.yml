name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Install Syft and Grype CLIs directly (Using sudo to prevent 127 directory errors)
      - name: Install Syft and Grype CLIs
        run: |
          curl -sSfL https://githubusercontent.com | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://githubusercontent.com | sudo sh -s -- -b /usr/local/bin

      # 2. Install dependencies so node_modules exists
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 3. Generate SBOM using explicit shell redirection
      - name: Generate Full SBOM
        run: |
          syft dir:./node_modules --exclude "" -o spdx-json > juiceshop.sbom.spdx.json
          ls -lh juiceshop.sbom.spdx.json

      # 4. Upload the confirmed file as an artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom-spdx
          path: juiceshop.sbom.spdx.json
